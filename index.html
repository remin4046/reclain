<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리클라인 ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="characters.js?v=20261119-skill"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b86a;--gold2:#f3dd9c;--ink:#e9e2d0;--panel:rgba(18,14,10,.88);--line:#6b5532}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0907;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hidden{display:none!important}
button{font-family:inherit}
.btn{background:linear-gradient(#5a4526,#3a2c18);border:1px solid var(--gold);color:var(--gold2);padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.25)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{padding:3px 8px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6);border-radius:6px}
.ttl{font-family:'Nanum Myeongjo',serif;color:var(--gold2);font-weight:800}
/* title / create */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3a2a14 0%,#120d08 60%,#060504 100%);z-index:50;overflow:auto}
#screen .box{width:min(980px,96vw);padding:22px 26px;margin:20px}
.logo{font-family:'Nanum Myeongjo',serif;font-size:64px;font-weight:800;text-align:center;letter-spacing:10px;background:linear-gradient(#fff3c4,#d9a441 55%,#7a5317);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.2);margin:6px 0 0}
.sub{text-align:center;color:#b9a77f;margin-bottom:18px;font-size:13px;letter-spacing:3px}
.chars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.ch{border:1px solid #4a3a22;border-radius:6px;padding:6px 2px 8px;text-align:center;cursor:pointer;background:rgba(0,0,0,.35);transition:.15s}
.ch:hover{border-color:var(--gold)}
.ch.sel{border-color:var(--gold2);background:rgba(217,184,106,.16);box-shadow:0 0 12px rgba(217,184,106,.35)}
.ch canvas{width:100%;height:auto;display:block}
.ch b{font-size:13px;color:var(--gold2)}
.ch small{display:block;color:#a8987a;font-size:11px}
.crow{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.crow>div{flex:1;min-width:280px}
.stat{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.stat span.k{width:42px;color:var(--gold)}
.stat span.v{width:28px;text-align:center;font-weight:700}
input.tx{background:#0d0a07;border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:4px;font-size:14px;width:100%}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{border:1px solid #4a3a22;border-radius:6px;padding:8px;text-align:center;background:rgba(0,0,0,.3);min-height:150px;cursor:pointer}
.slot:hover{border-color:var(--gold)}
.slot canvas{width:90px;height:auto}
.note{font-size:12px;color:#9d8f73}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#stat{position:absolute;left:10px;top:10px;padding:8px 10px;width:250px}
.bar{height:14px;border:1px solid #000;border-radius:3px;background:#1a1410;position:relative;margin:3px 0;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar em{position:absolute;inset:0;text-align:center;font-size:10px;line-height:13px;font-style:normal;text-shadow:0 1px 1px #000}
#hpb i{background:linear-gradient(#e35050,#8e1b1b)}#mpb i{background:linear-gradient(#5a8cf0,#1d3f94)}#exb i{background:linear-gradient(#e9d27a,#9a7a1c)}
#stat .nm{font-weight:700;color:var(--gold2);font-size:14px}
#stat .lv{font-size:12px;color:#c9b88f}
#mini{position:absolute;right:10px;top:10px;padding:6px}
#mini canvas{display:block;width:200px;height:200px;image-rendering:pixelated}
#mini .mapn{font-size:12px;text-align:center;color:var(--gold2);margin-bottom:3px}
#hot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:6px}
.hk{width:54px;height:54px;border:1px solid #5b482a;border-radius:4px;background:#100c08;position:relative;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:1.15;padding:2px}
.hk:hover{border-color:var(--gold)}
.hk b{position:absolute;left:3px;top:1px;color:var(--gold);font-size:10px}
.hk s{position:absolute;right:3px;bottom:1px;text-decoration:none;color:#fff;font-size:10px}
#log{position:absolute;left:10px;bottom:10px;width:380px;height:170px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column}
#logl{flex:1;overflow-y:auto;line-height:1.45}
#logl div{text-shadow:0 1px 1px #000}
#chatin{margin-top:4px;padding:4px 6px;font-size:12px}
.c-sys{color:#e6d38a}.c-dmg{color:#ff9a7a}.c-get{color:#9fe39a}.c-chat{color:#fff}.c-bad{color:#ff6b6b}.c-peer{color:#9fd3ff}
#menu{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;padding:6px}
.win{position:absolute;padding:10px 12px;max-height:80vh;overflow:auto;z-index:20}
.win h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.win h3 .x{cursor:pointer;color:#c9b88f;font-size:14px}
#inv{right:220px;top:10px;width:452px;background:linear-gradient(160deg,rgba(58,52,58,.96),rgba(26,22,26,.96));border-color:#7a6a5a}
.pd{display:flex;gap:8px}.pl{width:176px}.pr{flex:1;position:relative;min-height:300px;background:radial-gradient(ellipse at 50% 40%,rgba(90,80,96,.55),rgba(10,8,12,.6));border:1px solid #3a3238;border-radius:4px}
.ps{width:100%;border-collapse:collapse;font-size:11.5px;font-family:Georgia,'Nanum Myeongjo',serif}.ps td{padding:1.5px 4px;border-bottom:1px solid rgba(255,255,255,.04)}.ps td:last-child{text-align:right;color:#f1ead8}.ps tr.hd td{color:#f3dd9c;background:rgba(0,0,0,.35);font-weight:700}.ps tr.sp td{height:5px;border:0}.ps td:first-child{color:#cfc4b0}
#pdc{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:150px;height:234px;pointer-events:none}
.dollg{position:relative;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(5,46px);gap:9px 26px;justify-content:center;padding:10px 0;grid-template-areas:". helm amul" "shirt armor cloak" "wpn glove shld" "r1 belt r2" "r3 boot r4"}
.sq{width:44px;height:44px;border:1px solid #6a5a48;background:linear-gradient(145deg,rgba(0,0,0,.55),rgba(40,34,30,.75));box-shadow:inset 0 0 6px rgba(0,0,0,.9),0 0 0 1px #000;border-radius:2px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq:hover{border-color:#e6c878;box-shadow:inset 0 0 6px #000,0 0 6px rgba(230,200,120,.5)}.sq img{width:40px;height:40px}.sq span{font-size:9.5px;color:#7a6c5a}.sq.e{cursor:default}.sq.e:hover{border-color:#6a5a48;box-shadow:inset 0 0 6px rgba(0,0,0,.9)}
.sq i{position:absolute;font-style:normal;font-size:10px;font-weight:700;text-shadow:0 0 2px #000,0 0 2px #000}.sq i.ct{right:2px;bottom:0;color:#fff}.sq i.en{left:2px;top:0;color:#9fd3ff}
.bag{display:grid;grid-template-columns:repeat(9,44px);gap:4px;max-height:200px;overflow-y:auto;padding:2px}
.eq{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.eqs{border:1px solid #4a3a22;border-radius:3px;min-height:40px;font-size:11px;padding:3px;background:#0f0b08;cursor:pointer}
.eqs u{display:block;text-decoration:none;color:#857455;font-size:10px}
.eqs:hover{border-color:var(--gold)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.it{border:1px solid #3a2e1c;border-radius:3px;padding:4px 6px;font-size:12px;cursor:pointer;background:#0f0b08;display:flex;justify-content:space-between;gap:4px}
.it:hover{border-color:var(--gold)}
.it .q{color:#c9b88f}
.r1{color:#ffffff}.r2{color:#8fd0ff}.r3{color:#f0c060}.r4{color:#ff8a8a}
#chr{left:270px;top:10px;width:300px}
#wmap{left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:92vh;background:linear-gradient(160deg,rgba(40,34,26,.97),rgba(18,15,11,.97))}
#wmcv{display:block;width:100%;height:auto;background:#07090c;border:1px solid #5a4a30;border-radius:4px;cursor:crosshair}
#wmap .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#cfc4a8;margin-top:6px}
#wmap .leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#wmap .bar2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#a99d80;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--gold)}
#npc{left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t td,table.t th{border-bottom:1px solid #2e2516;padding:4px 5px;text-align:left}
table.t th{color:var(--gold);position:sticky;top:0;background:#16110b}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs .btn.on{background:linear-gradient(#8a6a34,#5a4320)}
#tip{position:fixed;pointer-events:none;z-index:99;padding:7px 9px;font-size:12px;max-width:280px;line-height:1.5}
#tip b{color:var(--gold2)}
#death{position:fixed;inset:0;background:rgba(40,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:60;gap:14px}
#death .ttl{font-size:40px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:'Nanum Myeongjo',serif;font-size:30px;color:var(--gold2);text-shadow:0 2px 6px #000;pointer-events:none;z-index:40;transition:opacity .6s}
#skw{left:50%;top:50%;transform:translate(-50%,-50%);width:min(800px,96vw);max-height:92vh;background:linear-gradient(160deg,rgba(44,36,54,.97),rgba(15,12,18,.97));border-color:#7a6a8a}
.skb{display:flex;gap:10px}.skl{flex:1;min-width:0}.skd{width:290px;flex:none;border:1px solid #3f3448;border-radius:4px;padding:10px;background:rgba(0,0,0,.32);font-size:12.5px;line-height:1.5}
.skf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;align-items:center}.skf .btn.on{background:linear-gradient(#8a6a34,#5a4320)}.skf label{font-size:11.5px;color:#b9ab90;margin-left:auto;cursor:pointer}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;max-height:54vh;overflow-y:auto;padding:2px}
.sk{position:relative;border:1px solid #4a3e52;border-radius:4px;background:rgba(0,0,0,.35);padding:6px 3px 5px;text-align:center;cursor:pointer;font-size:11.5px;line-height:1.25}
.sk img{width:44px;height:44px;display:block;margin:0 auto 4px;border-radius:5px}
.sk b{display:block;color:#f1ead8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk u{display:block;text-decoration:none;font-size:10px;margin-top:1px}
.sk.lock b{color:#9a90a0}.sk.cls{opacity:.5}
.sk:hover{border-color:var(--gold)}.sk.sel{border-color:var(--gold2);box-shadow:0 0 9px rgba(243,221,156,.45);background:rgba(217,184,106,.12)}
.u-ok{color:#9fe39a}.u-lv{color:#ffd77a}.u-bk{color:#d9b0ff}.u-cl{color:#8a8a8a}
.badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700}
.b-ok{background:#2c5428;color:#d3f5c6}.b-lv{background:#5a4a1a;color:#ffe7a0}.b-bk{background:#4a2a5e;color:#ead2ff}.b-cl{background:#3a3a3a;color:#c4c4c4}
.skd .hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}.skd .hd img{width:56px;height:56px;border-radius:6px}.skd .hd .ttl{font-size:17px}
.skd .kv{grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}
.skd .ef{margin:8px 0;padding:6px 8px;border-left:3px solid #b08ae0;background:rgba(150,110,200,.12);color:#efe4ff}
.skd .how{margin-top:8px;padding-top:8px;border-top:1px dashed #4a3e52}
.skhot{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid #3f3448;flex-wrap:wrap}
.hk:has(img){flex-direction:column;justify-content:center}.hk img{width:28px;height:28px;display:block;margin:0 auto 1px;border-radius:3px;pointer-events:none}
.hk span{display:block;max-width:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5px}
.hk.drop,.hk.pick{border-color:var(--gold2);box-shadow:0 0 8px rgba(243,221,156,.6)}
#buffs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}#buffs span{font-size:10.5px;padding:0 5px;border-radius:3px;background:rgba(120,90,170,.35);color:#eadcff;border:1px solid rgba(180,150,230,.35)}
@media (max-width:760px){.skb{flex-direction:column}.skd{width:auto}.skgrid{max-height:30vh}}
.sq[draggable=true]{cursor:grab}.sq.drag{opacity:.35}.sq.drop{border-color:#f3dd9c!important;box-shadow:inset 0 0 6px #000,0 0 9px rgba(243,221,156,.75)!important}.sq.bad{border-color:#c44!important}
.bag.drop{outline:1px dashed #f3dd9c;outline-offset:2px}
#qty{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:70;padding:14px 16px;width:280px}
#qty h3{margin:0 0 8px;font-size:15px}#qty .row{display:flex;gap:6px;align-items:center;margin:8px 0}#qty input[type=number]{width:90px}#qty input[type=range]{flex:1}
.iinfo .hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}.iinfo .hd img{width:56px;height:56px;border:1px solid #6a5a48;border-radius:4px;background:#0d0a07}
.iinfo .hd b{font-size:18px;font-family:'Nanum Myeongjo',serif}.iinfo .kv{grid-template-columns:110px 1fr;font-size:12.5px;gap:3px 10px}
.iinfo .sec{margin-top:10px;padding-top:8px;border-top:1px dashed #4a3a22;font-size:12.5px;line-height:1.6}.iinfo .sec>b{color:var(--gold2);display:block;margin-bottom:2px}
.iinfo .chip{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border:1px solid #4a3a22;border-radius:10px;background:#120d08;font-size:12px;cursor:pointer}.iinfo .chip:hover{border-color:var(--gold)}
#online{position:absolute;right:10px;top:278px;padding:6px 8px;font-size:11.5px;max-width:200px}
@media (max-width:760px){.chars{grid-template-columns:repeat(4,1fr)}#log{width:60vw;height:120px}#mini canvas{width:120px;height:120px}#inv{right:4px;width:94vw}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="screen"><div class="box panel" id="sbox"></div></div>
<div id="hud" class="hidden">
  <div id="stat" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="nm" id="snm"></span><span class="lv" id="slv"></span></div>
    <div class="bar" id="hpb"><i></i><em></em></div>
    <div class="bar" id="mpb"><i></i><em></em></div>
    <div class="bar" id="exb"><i></i><em></em></div>
    <div class="lv" id="sgold"></div>
    <div id="buffs"></div>
  </div>
  <div id="mini" class="panel"><div class="mapn" id="mapn"></div><canvas id="mcv" width="200" height="200"></canvas><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11px"><span id="fps" class="note">-</span><select id="qsel" style="background:#0d0a07;color:#e9e2d0;border:1px solid #6b5532;font-size:11px;border-radius:3px"><option value="a">화질 자동</option><option value="0">고화질</option><option value="1">표준</option><option value="2">성능</option><option value="3">최대 성능</option></select></div></div>
  <div id="online" class="panel hidden"></div>
  <div id="diag" class="panel hidden" style="position:absolute;right:10px;top:360px;width:300px;padding:8px 10px;font-size:11.5px;line-height:1.55"></div>
  <div id="hot" class="panel"></div>
  <div id="log" class="panel"><div id="logl"></div><input id="chatin" class="tx" placeholder="Enter로 채팅 · /도움말" maxlength="80"></div>
  <div id="menu" class="panel">
    <button class="btn sm" data-w="inv">인벤토리 (I)</button>
    <button class="btn sm" data-w="chr">캐릭터 (C)</button>
    <button class="btn sm" data-w="skw">마법 (K)</button>
    <button class="btn sm" data-w="wmap">지도 (M)</button>
    <button class="btn sm" id="bsave">저장</button>
    <button class="btn sm" id="bexit">캐릭터 선택</button>
  </div>
  <div id="inv" class="win panel hidden"></div>
  <div id="chr" class="win panel hidden"></div>
  <div id="skw" class="win panel hidden"></div>
  <div id="wmap" class="win panel hidden"><h3><span id="wmt">지도</span><span class="x" id="wmx">닫기 ✕</span></h3>
    <canvas id="wmcv" width="1440" height="820"></canvas>
    <div class="bar2"><span id="wmpos">-</span><span>클릭: 자동 이동 · 휠: 확대/축소 · 드래그: 지도 이동 · <a href="#" id="wmme" style="color:#e9c56a">내 위치로</a></span></div>
    <div class="leg"><span><i style="background:#fff"></i>나</span><span><i style="background:#6cf"></i>다른 플레이어</span><span><i style="background:#ffd65a"></i>NPC</span><span><i style="background:#c79bff"></i>포탈·입구</span><span><i style="background:#f55"></i>몬스터</span><span><i style="background:#7fe07f"></i>이동 경로</span></div></div>
  <div id="npc" class="win panel hidden"></div>
  <div id="qty" class="panel hidden"></div>
</div>
<div id="tip" class="panel hidden"></div>
<div id="toast"></div>

// ===== world generation & rendering =====
const TW=64,TH=32;
const T={DEEP:0,SHAL:1,SAND:2,GRASS:3,FOREST:4,ROAD:5,STONE:6,CFLOOR:7,CWALL:8};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function h2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,sc,s){const fx=x/sc,fy=y/sc,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,u=tx*tx*(3-2*tx),v=ty*ty*(3-2*ty);
  const a=h2(ix,iy,s),b=h2(ix+1,iy,s),c=h2(ix,iy+1,s),d=h2(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){return vnoise(x,y,24,s)*.55+vnoise(x,y,9,s+7)*.3+vnoise(x,y,4,s+13)*.15;}
function inPoly(x,y,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

class Map2{
  constructor(id,W,H,ox,oy){this.id=id;this.W=W;this.H=H;this.ox=ox;this.oy=oy;const n=W*H;this.t=new Uint8Array(n);this.o=new Uint8Array(n);this.b=new Uint8Array(n);this.v=new Uint8Array(n);this.npcs=[];this.portals=[];this.labels=[];this.houses=[];this.spawns=[];this.dark=false;}
  idx(x,y){return(y-this.oy)*this.W+(x-this.ox);}
  inb(x,y){return x>=this.ox&&y>=this.oy&&x<this.ox+this.W&&y<this.oy+this.H;}
  tile(x,y){return this.inb(x,y)?this.t[this.idx(x,y)]:T.DEEP;}
  walk(x,y){if(!this.inb(x,y))return false;const i=this.idx(x,y);const t=this.t[i];return!this.b[i]&&t!==T.DEEP&&t!==T.SHAL&&t!==T.CWALL;}
}

// ---------- dungeons ----------
function genDungeon(id){

  const lab=new Int32Array(W*H).fill(-1);let best=-1,bestN=0,regs=[];
  for(let i=0;i<W*H;i++){if(g[i]||lab[i]>=0)continue;const id2=regs.length,st=[i];lab[i]=id2;let n=0;while(st.length){const k=st.pop();n++;const x=k%W,y=(k/W)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const j=(y+dy)*W+x+dx;if(!g[j]&&lab[j]<0){lab[j]=id2;st.push(j);}});}regs.push(n);if(n>bestN){bestN=n;best=id2;}}
  for(let i=0;i<W*H;i++){const fl=!g[i]&&lab[i]===best;M.t[i]=fl?T.CFLOOR:T.CWALL;M.v[i]=(h2(i%W,(i/W)|0,id)*8)|0;}
  // start = floor near top-left; far = max BFS
  let s=-1;for(let d=0;d<W+H&&s<0;d++)for(let x=0;x<=d&&s<0;x++){const y=d-x;if(x<W&&y<H&&M.t[y*W+x]===T.CFLOOR)s=y*W+x;}
  const dist=new Int32Array(W*H).fill(-1),q=[s];dist[s]=0;let far=s;for(let h=0;h<q.length;h++){const k=q[h],x=k%W,y=(k/W)|0;if(dist[k]>dist[far])far=k;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const j=(y+dy)*W+x+dx;if(M.t[j]===T.CFLOOR&&dist[j]<0){dist[j]=dist[k]+1;q.push(j);}});}
  const P=k=>[k%W+ox,((k/W)|0)+oy];
  const sp=P(s),fp=P(far);
  M.portals.push({x:sp[0],y:sp[1],to:id-1,name:id===1?'말하는 섬 (지상)':'던전 1층',up:true});
  if(id===1)M.portals.push({x:fp[0],y:fp[1],to:2,name:'던전 2층'});
  M.start=findNear(M,sp[0],sp[1]);
  M.far=fp;
  // rocks/pillars decor
  for(let i=0;i<W*H;i++){if(M.t[i]===T.CFLOOR&&h2(i,id,8)<.012&&dist[i]>4){M.o[i]=7;M.b[i]=1;}}
  // spawns
  const list=GD.mapMons[id].filter(n=>!GD.mons[n].boss);const cnt=id===1?75:90;
  const floors=[];for(let i=0;i<W*H;i++)if(M.t[i]===T.CFLOOR&&!M.b[i]&&dist[i]>12)floors.push(i);
  for(let k=0;k<cnt;k++){const i=floors[(r()*floors.length)|0],[x,y]=P(i);const lvW=list.map(n=>1/(1+Math.abs(GD.mons[n].lv-(id===1?8:13))));let tot=lvW.reduce((a,b)=>a+b),pick=r()*tot,n=list[0];for(let j=0;j<list.length;j++){pick-=lvW[j];if(pick<=0){n=list[j];break;}}
    M.spawns.push({n,x,y,box:[x-6,y-6,x+6,y+6]});}
  if(id===2){const b=GD.mapMons[2].find(n=>GD.mons[n].boss);if(b)M.spawns.push({n:b,x:fp[0],y:fp[1],box:[fp[0]-4,fp[1]-4,fp[0]+4,fp[1]+4],boss:true});

}

function dirFrom(dx,dy){const sx=dx-dy,sy=dx+dy;if(Math.abs(sx)>Math.abs(sy)*1.2)return sx>0?'E':'W';return sy>0?'S':'N';}
function stepPlayer(dt,C){P._mspd=C.mspd;
  if(P.t<1){P.t=Math.min(1,P.t+dt/C.mspd);return;}
  let dx=0,dy=0;const k=G.keys;
  const up=k.ArrowUp||k.w,dn=k.ArrowDown||k.s,lf=k.ArrowLeft||k.a,rt=k.ArrowRight||k.d;
  if(up){dx--;dy--;}if(dn){dx++;dy++;}if(lf){dx--;dy++;}if(rt){dx++;dy--;}
  dx=Math.sign(dx);dy=Math.sign(dy);
  if(dx||dy){G.path=null;G.target=null;}
  else if(G.target){const m=G.target;if(m.dead||m.map===false){G.target=null;}else{const d=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));
      if(d<=C.range){tryAttack(m,C);return;}
      if(!G.path||!G.path.length||(G.pathFor!==m.x+','+m.y&&G.time-(G.planT||0)>350)){G.planT=G.time;G.path=findPath(P.x,P.y,m.x,m.y,2500,C.range);G.pathFor=m.x+','+m.y;if(!G.path){G.target=null;return;}}}}
  if(!dx&&!dy&&G.path&&G.path.length){const[nx,ny]=G.path[0];dx=nx-P.x;dy=ny-P.y;if(!G.map.walk(nx,ny)){G.path=null;return;}G.path.shift();}
  if(!dx&&!dy)return;
  let nx=P.x+dx,ny=P.y+dy;const M=G.map;
  if(!M.walk(nx,ny)||(dx&&dy&&(!M.walk(P.x+dx,P.y)||!M.walk(P.x,P.y+dy)))){if(M.walk(P.x+dx,P.y)&&dx){ny=P.y;dy=0;}else if(M.walk(P.x,P.y+dy)&&dy){nx=P.x;dx=0;}else{P.dir=dirFrom(dx,dy);P.face=faceFrom(dx,dy);return;}}
  P.dir=dirFrom(dx,dy);P.face=faceFrom(dx,dy);P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0;
  onStep();
}
function onStep(){const M=G.map;
  for(const p of M.portals){if(p.x===P.x&&p.y===P.y){usePortal(p);return;}}
  // auto pickup
  for(const g of [...G.ground]){if(g.x===P.x&&g.y===P.y&&g.map===M.id)pickup(g);}
  pushPresence();}
function usePortal(p){if(p.locked){if(G.lockMsg!==p){G.lockMsg=p;log(p.name+'은(는) 아직 열리지 않은 곳입니다. (다음 업데이트 예정)','c-sys');}return;}
  if(p.ax){const tm=getMap(p.to);const a=tm.walk(p.ax,p.ay)?[p.ax,p.ay]:findNear(tm,p.ax,p.ay);enterMap(p.to,a[0],a[1]);log(p.name+'(으)로 이동했습니다.','c-sys');return;}
  if(p.to===0){const e=GD.portals.find(q=>q.frm===0&&q.to===1);enterMap(0,e.x+2,e.y+2);}else if(p.to===1&&G.map.id===2){const m1=getMap(1);const sp2=findNear(m1,m1.far[0],m1.far[1]);enterMap(1,sp2[0],sp2[1]);}else enterMap(p.to);log(p.name+'(으)로 이동했습니다.','c-sys');}
function pickup(g){G.ground.splice(G.ground.indexOf(g),1);invAdd(g.n,g.q,g.e);log((g.n==='아데나'?fmt(g.q)+' 아데나':itemName(g)+(g.q>1?' ('+g.q+')':''))+'을(를) 획득했습니다.','c-get');refreshUI();}

// ---------- combat ----------
function hitChance(lv,hitB,ac,mlv){return Math.max(.08,Math.min(.95,.62+(lv-mlv)*.035+hitB*.04+(ac-5)*.012));}
function aimAt(m){P.aimA=Math.atan2((m.x+m.y-P.x-P.y)*16,(m.x-m.y-P.x+P.y)*32);}
function tryAttack(m,C){const now=G.time;if(now-G.lastAtk<C.aspd)return;
  P.dir=dirFrom(m.x-P.x,m.y-P.y);P.face=faceFrom(m.x-P.x,m.y-P.y);G.lastAtk=now;P.atkT=now;P.atkK=C.ranged?'b':'m';P.atkM='attack';aimAt(m);
  if(C.ranged){if(invCount('화살')+invCount('은 화살')<=0){log('화살이 없습니다.','c-bad');G.target=null;return;}
    const an=invCount('은 화살')>0?'은 화살':'화살';invRemove(an,1);
    G.fx.push({k:'arrow',x0:P.x,y0:P.y,x1:m.x,y1:m.y,t0:now+230,dur:180+Math.hypot(m.x-P.x,m.y-P.y)*25,cb:()=>meleeResolve(m,C,an)});}
  else meleeResolve(m,C);
}
function meleeResolve(m,C,arrow){if(m.dead)return;const w=eqItem('weapon'),wd=w?ITEM(w.n):null;
  const hit=hitChance(P.lv,C.ranged?C.rhit+fx('DEX→원거리 추가 대미지',C.s.DEX):C.mhit+Math.floor((C.s.STR-10)/3),m.weakT>G.time?m.ac+4:m.ac,m.lv);
  if(Math.random()>hit){addFloat(m.x,m.y,'MISS','#ccc');return;}
  let d;if(wd){const big=m.lv>=20||m.boss;d=rnd(1,(big?wd.dl:wd.ds)||2)+(w.e||0);}else d=rnd(1,2);
  if(C.ranged){const ad=ITEM(arrow);d+=rnd(1,ad.ds||4);d+=C.rdmg;}else d+=C.mdmg;
  if(G.buffs.bash){d=Math.round(d*1.8);G.buffs.bash=0;addFx('slash',m.x,m.y,'#ffd060');}
  d=Math.max(1,d);damageMon(m,d);}
function damageMon(m,d,col,by){m.hp-=d;m.sleepT=0;m.killer=by||P;m.hitT=G.time;m.attacked=true;addFloat(m.x,m.y,d,col||'#fff');
  if(m.dummy){m.hp=m.mhp;if((by||P)===P)dummyExp();return;}
  if(m.hp<=0)killMon(m,m.killer);}
const DUMMY_MAXLV=10;
function dummyExp(){if(G.time-(G.dumT||0)<250)return;G.dumT=G.time;if(P.lv>=DUMMY_MAXLV){if(!G.dummyWarn||G.time-G.dummyWarn>15000){G.dummyWarn=G.time;log('허수아비 수련은 레벨 '+DUMMY_MAXLV+'까지만 경험치를 얻을 수 있습니다. 이제 사냥터로 나가 보세요!','c-sys');}return;}
  gainExp(Math.max(1,Math.ceil(expNeed(P.lv)/40)));}
function killMon(m,killer){killer=killer||P;m.dead=true;m.respawn=G.time+(m.boss?300000:25000+Math.random()*15000);if(G.target===m)G.target=null;
  gainExp(m.exp);dropLoot(m,killer);if(m.boss)toast(m.n+' 처치!');}
function dropLoot(m,killer){killer=killer||P;const list=GD.drops[m.n]||GD.drops[m.n.split(' (')[0]]||[];const out=[];
  if(Math.random()<.75)out.push(['아데나',rnd(m.lv*2,m.lv*8)*(m.boss?20:1)]);
  for(const n of list){if(n==='아데나')continue;const d=ITEM(n);let p=d.cat==='소비/제작'?.08:d.cat==='마법/기술서'?.006:.025;if(m.boss)p*=8;if(Math.random()<p)out.push([n,d.sub==='화살'?rnd(5,30):1]);}
  if(Math.random()<.06)out.push(['체력 회복제',1]);
  // 자동 획득: 드롭 아이템은 바닥에 떨어지지 않고 바로 인벤토리로
  // 처치한 캐릭터에게 자동 루팅
  if(killer!==P)return;
  out.forEach(([n,q])=>{invAdd(n,q,0);addFloat(m.x,m.y,n==='아데나'?'+'+fmt(q):n,'#ffe08a',1);log('[자동 루팅] '+(n==='아데나'?fmt(q)+' 아데나':itemName({n,q,e:0})+(q>1?' ('+q+')':''))+'을(를) 획득했습니다.','c-get');});
  if(out.length){G.saveDirty=true;refreshUI();}}
function gainExp(e){if(P.lv>=99)return;P.exp+=e;addFloat(P.x,P.y,'+'+e+' EXP','#e9d27a',1);
  while(P.exp>=expNeed(P.lv)){P.exp-=expNeed(P.lv);P.lv++;const C=calc();
    const hp=rnd(...HPLV[P.cls])+Math.max(0,Math.floor((C.s.CON-14)/2)),mp=rnd(...MPLV[P.cls])+Math.max(0,Math.floor((C.s.WIS-12)/2));
    P.mhp+=hp;P.mmp+=mp;P.hp=P.mhp;P.mp=P.mmp;if(P.lv>=51&&P.lv%1===0)P.bonus=(P.bonus||0)+1;
    toast('레벨 업! Lv.'+P.lv);log('레벨이 '+P.lv+'(으)로 올랐습니다. (HP +'+hp+', MP +'+mp+')','c-sys');addFx('lvup',P.x,P.y);}
  G.saveDirty=true;refreshUI();}
function playerHit(m,d,magic){const C=calc();if(G.dead)return;
  if(magic&&G.buffs.cmag>G.time){G.buffs.cmag=0;addFloat(P.x,P.y,'카운터 매직','#c8c8ff',1);log('카운터 매직이 마법 공격을 막아 냈습니다.','c-sys');return;}
  if(G.buffs.solid>G.time&&P.eq.shield&&Math.random()<.25){addFloat(P.x,P.y,'방패 막기','#bcd0f0',1);return;}
  const ch=Math.max(.05,Math.min(.95,.5+(m.lv-P.lv)*.03+C.AC*.025));
  if(Math.random()>ch){addFloat(P.x,P.y,'MISS','#9cf',1);return;}
  d=Math.max(1,d-Math.max(0,Math.floor(-C.AC/6))-(G.buffs.redu>G.time?2:0));P.hp-=d;addFloat(P.x,P.y,d,'#ff6060',1);P.hitT=G.time;
  if(P.hp<=0){P.hp=0;die();}refreshBars();}
function die(){G.dead=true;if(P.poly){log('「'+P.poly.n+'」 변신이 풀렸습니다.','c-sys');P.poly=null;G.saveDirty=true;pushPresence(true);}const loss=Math.floor(expNeed(P.lv)*.05);P.exp=Math.max(0,P.exp-loss);$('#death').classList.remove('hidden');G.target=null;G.path=null;log('사망했습니다. 경험치 '+fmt(loss)+' 손실','c-bad');}
function revive(){G.dead=false;P.hp=Math.ceil(P.mhp*.5);P.mp=Math.ceil(P.mmp*.5);$('#death').classList.add('hidden');enterMap(0,32600,32936);refreshUI();}

// ---------- monster AI ----------
function updMons(dt){const now=G.time;for(const m of G.mons){
  if(m.dead){if(now>m.respawn){const n=spawnMon(m.sp);if(n)Object.assign(m,n);}continue;}
  if(m.t<1){m.t=Math.min(1,m.t+dt/(m.spd*(m.slowT>now?1.8:1)));continue;}
  if(m.stunT>now||m.sleepT>now)continue;
  if(now<m.next)continue;
  if(G.map.big&&!m.attacked&&Math.abs(m.x-P.x)+Math.abs(m.y-P.y)>70){m.next=now+1500;continue;}
  const d=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));
  const chase=!(m.calmT>now)&&!G.dead&&!inSafe(P.x,P.y)&&(m.attacked&&d<16||m.aggro&&d<8)&&G.map.id===P.map;
  if(chase){const rng2=m.ranged||1;
    const kzB=m.n==='커츠';if((m.n==='데스나이트'||kzB)&&d<=6&&now>(m.nextSk||0)){m.face=faceFrom(P.x-m.x,P.y-m.y);m.dir=dirFrom(P.x-m.x,P.y-m.y)==='W'?'W':'E';
      if(m.hp<m.mhp*.6&&now>(m.nextBuff||0)){m.skT=now;m.skK='buff';m.nextBuff=now+25000;m.nextSk=now+4000;m.next=now+800;const h=Math.round(m.mhp*.04);m.hp=Math.min(m.mhp,m.hp+h);m.dkRage=now+15000;addFloat(m.x,m.y,'+'+h,kzB?'#ffb070':'#8ff7e4');G.fx.push({k:'ring',r:1,col:kzB?'255,140,60':'140,250,228',x0:m.x,y0:m.y,x1:m.x,y1:m.y,t0:now,dur:800});log(kzB?'커츠가 전쟁의 함성을 내지릅니다! (15초간 공격력 증가)':'데스나이트가 망령의 힘을 끌어올립니다! (15초간 공격력 증가)','c-bad');continue;}
      m.skT=now;m.skK='skill';m.nextSk=now+9000+Math.random()*3000;m.next=now+900;
      const sr=kzB?3:4;if(kzB)log('커츠가 대검으로 대지를 가릅니다!','c-bad');G.fx.push({k:'ring',r:sr,col:kzB?'255,140,60':'140,250,228',x0:m.x,y0:m.y,x1:m.x,y1:m.y,t0:now+330,dur:600,cb:()=>{if(kzB)addFx('boom',m.x,m.y);if(!m.dead&&G.map.id===P.map&&Math.max(Math.abs(P.x-m.x),Math.abs(P.y-m.y))<=sr)playerHit(m,Math.round((kzB?rnd(40,80):rnd(30,70))*(m.dkRage>G.time?1.3:1)),!kzB);}});continue;}
    if(d<=rng2){m.dir=dirFrom(P.x-m.x,P.y-m.y)==='W'?'W':'E';m.face=faceFrom(P.x-m.x,P.y-m.y);m.next=now+m.aspd*(m.slowT>now?1.6:1);m.atkT=now;
      let dmg=rnd(m.dmg[0],Math.ceil(m.dmg[1]));if(m.brkT>now)dmg=Math.max(1,Math.round(dmg*.6));if(m.dkRage>now)dmg=Math.round(dmg*1.3);
      if(m.blindT>now&&Math.random()<.5){addFloat(P.x,P.y,'MISS','#9cf',1);continue;}
      const mk=m.n.includes('장로')||m.n.includes('괴물')?'mbolt':'arrow';
      if(m.ranged){G.fx.push({k:mk,x0:m.x,y0:m.y,x1:P.x,y1:P.y,t0:now,dur:300,cb:()=>playerHit(m,dmg,mk==='mbolt')});}else playerHit(m,dmg);continue;}
    if(m.bindT>now){m.next=now+400;continue;}
    const sx=Math.sign(P.x-m.x),sy=Math.sign(P.y-m.y);let moved=false;
    for(const[ax,ay]of[[sx,sy],[sx,0],[0,sy],[sx,-sy],[-sx,sy]]){if(!ax&&!ay)continue;const nx=m.x+ax,ny=m.y+ay;if(G.map.walk(nx,ny)&&!inSafe(nx,ny)&&!(nx===P.x&&ny===P.y)){m.fx=m.x;m.fy=m.y;m.x=nx;m.y=ny;m.t=0;m.dir=(ax-ay)>=0?'E':'W';m.face=faceFrom(ax,ay);m.run=true;moved=true;break;}}
    m.next=now+(moved?0:400);continue;}
  if(m.attacked&&d>=16)m.attacked=false;
  // wander
  if(!(m.bindT>now)&&Math.random()<.5){const ax=rnd(-1,1),ay=rnd(-1,1),nx=m.x+ax,ny=m.y+ay,b=m.sp.box;
    if((ax||ay)&&G.map.walk(nx,ny)&&!inSafe(nx,ny)&&nx>=b[0]-3&&nx<=b[2]+3&&ny>=b[1]-3&&ny<=b[3]+3){m.fx=m.x;m.fy=m.y;m.x=nx;m.y=ny;m.t=0;m.dir=(ax-ay)>=0?'E':'W';m.face=faceFrom(ax,ay);m.run=false;}}
  m.next=now+1200+Math.random()*2500;}}

// ---------- items use ----------
function useItem(it){const d=ITEM(it.n),n=it.n,C=calc();
  if(G.dead)return;
  const slot=slotOf(n);if(slot){toggleEquip(it);return;}
  const heal={'체력 회복제':[6,27],'고급 체력 회복제':[26,68],'강력 체력 회복제':[44,107],'엔트의 열매':[44,107]}[n];
  if(heal){if(P.hp>=P.mhp+C.mhpB){log('HP가 가득 차 있습니다.','c-sys');return;}const h=rnd(...heal);P.hp=Math.min(P.mhp+C.mhpB,P.hp+h);invRemove(n,1);addFloat(P.x,P.y,'+'+h,'#7f7',1);addFx('heal',P.x,P.y);refreshUI();return;}
  if(n==='마력 회복 물약'){P.mp=Math.min(P.mmp,P.mp+rnd(10,20));invRemove(n,1);refreshUI();return;}
  if(n==='속도향상 물약'||n==='강화 속도향상 물약'){G.buffs.haste=G.time+(n.startsWith('강화')?1800000:300000);invRemove(n,1);log('몸이 빨라졌습니다.','c-sys');addFx('heal',P.x,P.y,'#7fd');refreshUI();return;}
  if(n==='용기의 물약'){if(P.cls!=='knight'){log('기사만 사용할 수 있습니다.','c-bad');return;}G.buffs.haste=G.time+300000;invRemove(n,1);log('용기가 솟아납니다. (공격 속도 증가)','c-sys');refreshUI();return;}
  if(n==='드래곤의 진주'){G.buffs.pearl=G.time+600000;G.pearlNote=1;invRemove(n,1);log('드래곤의 진주를 먹었습니다. 10분간 몸이 더욱 빨라집니다.','c-sys');addFx('heal',P.x,P.y,'#ffd36b');G.saveDirty=true;refreshUI();return;}
  if(n==='엘븐 와퍼'){if(P.cls!=='elf'){log('요정만 사용할 수 있습니다.','c-bad');return;}G.buffs.wafer=G.time+480000;G.waferNote=1;invRemove(n,1);log('엘븐 와퍼를 먹었습니다. 8분간 공격 속도가 빨라집니다.','c-sys');addFx('heal',P.x,P.y,'#9f9');G.saveDirty=true;refreshUI();return;}
  if(n==='귀환 주문서'){invRemove(n,1);addFx('tele',P.x,P.y);enterMap(0,32600,32936);refreshUI();return;}
  if(n==='순간이동 주문서'){const M=G.map;for(let k=0;k<200;k++){const x=rnd(M.ox,M.ox+M.W-1),y=rnd(M.oy,M.oy+M.H-1);if(M.walk(x,y)&&!M.npcs.some(q=>q.x===x&&q.y===y)){invRemove(n,1);addFx('tele',P.x,P.y);P.x=P.fx=x;P.y=P.fy=y;P.t=1;G.path=null;G.target=null;addFx('tele',x,y);pushPresence(true);refreshUI();return;}}return;}
  if(n==='무기 마법 주문서'||n==='갑옷 마법 주문서'){openEnchant(n);return;}
  if(d.cat==='마법/기술서'){learnBook(it);return;}
  log(n+'은(는) 지금 사용할 수 없습니다.','c-sys');}
function learnBook(it){const k=BOOK2SK[it.n],S=SPELLS[k];if(!S){log(it.n+'은(는) 아직 읽을 수 없는 책입니다.','c-sys');return;}
  if(!S.cls.includes(P.cls)){log(CLSNAME[P.cls]+'은(는) 「'+S.name+'」을(를) 배울 수 없습니다. ('+S.cls.map(c=>CLSNAME[c]).join('·')+' 전용)','c-bad');return;}
  if(S.auto&&S.auto.includes(P.cls)){log('「'+S.name+'」은(는) '+CLSNAME[P.cls]+'이(가) Lv.'+S.lv+'에 자동으로 배우는 마법입니다.','c-sys');return;}
  P.skills=P.skills||[];if(P.skills.includes(k)){log('이미 「'+S.name+'」을(를) 알고 있습니다.','c-sys');return;}
  if(P.lv<S.lv){log('「'+S.name+'」은(는) Lv.'+S.lv+' 이상이 되어야 배울 수 있습니다.','c-bad');return;}
  if(!invRemove(it.n,1))return;P.skills.push(k);addFx('lvup',P.x,P.y);toast('새 마법: '+S.name);log('「'+S.name+'」을(를) 배웠습니다! 마법 창(K)에서 단축키에 등록하세요.','c-sys');
  SKW.sel=k;G.saveDirty=true;refreshUI();}
function toggleEquip(it){const n=it.n,slot0=slotOf(n);
  const cur=Object.entries(P.eq).find(([,u])=>u===it.u);
  if(cur){delete P.eq[cur[0]];log(itemName(it)+' 착용 해제','c-sys');G.saveDirty=true;refreshUI();return;}
  if(!canUse(n,P.cls)){log(CLSNAME[P.cls]+'은(는) '+n+'을(를) 사용할 수 없습니다.','c-bad');return;}
  let slot=slot0;if(slot==='ring'){slot=['ring1','ring2','ring3','ring4'].find(s=>!P.eq[s])||'ring1';}
  if(slot==='shield'){const w=eqItem('weapon');if(w&&twoHand(w.n)){log('양손 무기를 들고 있어 방패를 착용할 수 없습니다.','c-bad');return;}}
  if(slot==='weapon'&&twoHand(n)&&P.eq.shield){delete P.eq.shield;log('방패를 벗었습니다.','c-sys');}
  P.eq[slot]=it.u;log(itemName(it)+' 착용','c-sys');G.saveDirty=true;refreshUI();}

function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

function cmdItem(a){if(!ADMINS.includes(USERNAME)){log('운영자만 사용할 수 있는 명령어입니다.','c-bad');return;}
  if(!a.length){log('사용법: /아이템 생성 [+강화] 이름 [수량]  예) /아이템 생성 무기주문서 100개 · /아이템 생성 +10 마나의 지팡이','c-sys');return;}
  let en=0,q=1;if(/^[+-]\d+$/.test(a[0]))en=parseInt(a.shift(),10);
  // 수량: "100", "100개", "100 개", "x100", "×100", 이름에 붙은 "무기주문서100개"
  if(a.length>1&&a[a.length-1]==='개'&&/^\d+$/.test(a[a.length-2]))a.pop();
  {const L=a[a.length-1]||'';let m=a.length>1&&L.match(/^[x×*]?(\d+)개?$/i);if(m){q=parseInt(m[1],10);a.pop();}else if((m=L.match(/^(.*\D)(\d+)개$/))||(m=L.match(/^(.+?)[x×*](\d+)개?$/i))){q=parseInt(m[2],10);a[a.length-1]=m[1];}}

  const hit=findItem(name);if(!hit.length){log('「'+name+'」에 해당하는 아이템이 없습니다.','c-bad');return;}
  if(hit.length>1){log('「'+name+'」에 맞는 아이템이 여러 개입니다: '+hit.slice(0,8).join(', ')+(hit.length>8?' 외 '+(hit.length-8)+'개':''),'c-sys');return;}
  const n=hit[0],d=ITEM(n);
  if(n==='아데나'){q=Math.min(q,100000000);P.gold+=q;log('[운영자] '+fmt(q)+' 아데나를 생성했습니다.','c-get');G.saveDirty=true;refreshUI();return;}
  const canEn=d.cat==='무기'||d.cat==='방어구'||d.cat==='액세서리';if(en&&!canEn){log(n+'은(는) 강화할 수 없는 아이템이라 +'+en+'은(는) 무시합니다.','c-sys');en=0;}
  en=Math.max(-7,Math.min(20,en));

function worldAt(mx,my){const[cx,cy]=G.cam;const wx=mx+cx,wy=my+cy-16;return scr2tile(wx,wy);}
function pickAt(mx,my){const[cx,cy]=G.cam;let best=null,bd=1e9;const M=G.map;
  const test=(x,y,w,h,obj,dy=0)=>{const[a,b]=iso(x,y);const sx=a-cx,sy=b-cy+16;if(mx>sx-w/2&&mx<sx+w/2&&my>sy-h&&my<sy+6){const d=Math.abs(mx-sx)+Math.abs(my-(sy-h/2))-(x+y)*0.01;if(d<bd){bd=d;best=obj;}}};
  for(const m of G.mons){if(m.dead)continue;const[a,b]=ePos(m);const sc=MSIZE[monArch(m.n)]||1;test(a,b,48*sc,60*sc,m);}
  for(const n of M.npcs)test(n.x,n.y,40,96,n);
  for(const g of G.ground)if(g.map===M.id)test(g.x,g.y,26,24,g);
  return best;}
function nearestMon(){let b=null,bd=9;for(const m of G.mons){if(m.dead||m.dummy)continue;const d=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));if(d<bd){bd=d;b=m;}}return b;}
function setupInput(){
  addEventListener('keydown',e=>{if(!P||$('#hud').classList.contains('hidden'))return;const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
    if(typing){if(e.key==='Enter'&&document.activeElement.id==='chatin'){sendChat();}if(e.key==='Escape')document.activeElement.blur();return;}
    const k=e.key.length===1?e.key.toLowerCase():e.key;if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Alt'].includes(k)){G.keys[k]=true;e.preventDefault();}
    if(k>='1'&&k<='6')useHot(+k-1);if(e.key==='F3'){e.preventDefault();DIAG.on=!DIAG.on;$('#diag').classList.toggle('hidden',!DIAG.on);}if(k==='i')toggleWin('inv');if(k==='c')toggleWin('chr');if(k==='k')toggleWin('skw');if(k==='m')toggleWin('wmap');
    if(k===' '){e.preventDefault();const m=nearestMon();if(m)G.target=m;}
    if(k==='Enter'){$('#chatin').focus();e.preventDefault();}
    if(k==='Escape'){closeNpc();['inv','chr','wmap','skw'].forEach(i=>$('#'+i).classList.add('hidden'));hideTip();G.target=null;}});
  addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;G.keys[k]=false;});
  addEventListener('blur',()=>{G.keys={};});
  cv.addEventListener('mousemove',e=>{G.mouse=[e.clientX,e.clientY];if(P)G.hover=pickAt(e.clientX,e.clientY);});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('dragover',e=>{if(DRAG&&!DRAG.worn){e.preventDefault();e.dataTransfer.dropEffect='move';}});
  cv.addEventListener('drop',e=>{e.preventDefault();const it=DRAG&&invFind(DRAG.u);if(!it||!P||G.dead)return;askDrop(it,worldAt(e.clientX,e.clientY));});
  cv.addEventListener('mousedown',e=>{if(!P||G.dead||e.button!==0)return;const o=pickAt(e.clientX,e.clientY);
    if(o&&o.hp!=null){G.target=o;G.path=null;return;}
    if(o&&o.role){const d=Math.max(Math.abs(o.x-P.x),Math.abs(o.y-P.y));if(d<=2){openNpc(o);return;}G.target=null;G.path=findPath(P.x,P.y,o.x,o.y,5000,1);G.npcGo=o;return;}
    G.target=null;G.npcGo=null;const[tx,ty]=worldAt(e.clientX,e.clientY);let p=findPath(P.x,P.y,tx,ty,5000);if(!p)p=findPath(P.x,P.y,tx,ty,3000,1);G.path=p;});
  document.querySelectorAll('#menu [data-w]').forEach(b=>b.onclick=()=>toggleWin(b.dataset.w));initWorldMap();
  $('#bsave').onclick=()=>saveNow();$('#bexit').onclick=async()=>{await saveNow(true);P=null;closeNpc();renderOnline();showSelect();};
  $('#fps').style.cursor='pointer';$('#fps').title='클릭: 성능 진단';$('#fps').onclick=()=>{DIAG.on=!DIAG.on;$('#diag').classList.toggle('hidden',!DIAG.on);};const qs=$('#qsel');qs.value=PERF.auto?'a':String(PERF.q);qs.onchange=()=>{if(qs.value==='a')setQuality(1,true);else setQuality(+qs.value,false);qs.blur();};
  $('#brev').onclick=revive;addEventListener('resize',resize);
  addEventListener('beforeunload',()=>{if(P&&G.saveDirty)saveNow(true);});}
// ---------- loop ----------
let lastT=performance.now();
const QUALITY=[{name:'고화질',dpr:2},{name:'표준',dpr:1.25},{name:'성능',dpr:1},{name:'최대 성능',dpr:.75}];
const PERF={acc:0,n:0,fps:60,worst:0,hist:[],q:1,auto:true,lastAdapt:0};
try{const s=window.localStorage&&localStorage.getItem('reclain_q');if(s){const o=JSON.parse(s);PERF.q=o.q;PERF.auto=o.auto;}}catch(e){}
function showDiag(){const el=$('#diag');if(!DIAG.on){DIAG.acc={};DIAG.n=0;return;}const n=Math.max(1,DIAG.n),a=DIAG.acc,g=DIAG.gpuInfo(),f=v=>((v||0)/n).toFixed(1)+'ms';
  const busy=(a.logic+a.render)/n,fr=a.frame/n;
  let verdict=g.sw?'⚠ 그래픽 가속이 꺼져 있습니다 (소프트웨어 렌더링). 브라우저 설정에서 "그래픽 가속 사용"을 켜고 재시작하세요.':busy>14?'⚠ 게임 처리 자체가 무겁습니다. 이 화면을 캡처해서 보내주세요.':fr>busy*1.8&&fr>20?'⚠ 게임 처리는 '+busy.toFixed(1)+'ms로 가볍지만 프레임 간격이 '+fr.toFixed(1)+'ms입니다. 브라우저/OS가 속도를 제한하고 있습니다 (절전 모드, 배터리, 백그라운드 탭, 그래픽 가속 확인).':'정상 범위입니다.';
  el.innerHTML='<b style="color:#f3dd9c">성능 진단</b> (F3 닫기)<br>프레임 간격 '+fr.toFixed(1)+'ms · 게임 처리 '+busy.toFixed(1)+'ms<br>로직 '+f(a.logic)+' · 그리기 '+f(a.render)+'<br>└ 바닥 '+f(a.ground)+' · 물체 '+f(a.objects)+' · 효과 '+f(a.effects)+' · 미니맵 '+f(a.minimap)+'<br>그리는 개체 '+DIAG.draws+'개 · 해상도 '+cv.width+'×'+cv.height+' (배율 '+DPR+')<br>GPU: '+esc(g.s)+'<br><span style="color:'+(verdict.startsWith('⚠')?'#ff9a7a':'#9fe39a')+'">'+verdict+'</span>';
  DIAG.acc={};DIAG.n=0;}
function setQuality(q,auto){PERF.q=q;PERF.auto=auto;try{localStorage.setItem('reclain_q',JSON.stringify({q,auto}));}catch(e){}resize();for(const k in OVL)delete OVL[k];}
function adaptQuality(){if(!PERF.auto||PERF.hist.length<3||performance.now()-PERF.lastAdapt<5000)return;const avg=PERF.hist.reduce((a,b)=>a+b)/PERF.hist.length;
  if(avg<45&&PERF.q<QUALITY.length-1){PERF.lastAdapt=performance.now();setQuality(PERF.q+1,true);PERF.hist=[];}else if(avg>58&&PERF.q>0&&(window.devicePixelRatio||1)>1.3&&PERF.hiOk!==false){}}
function loop(t){const dt=Math.min(100,t-lastT);lastT=t;
  if(P&&G.map){const _l0=performance.now();G.time+=dt;const C=calc();if(!G.dead){stepPlayer(dt,C);if(G.npcGo&&(!G.path||!G.path.length)){const o=G.npcGo;G.npcGo=null;if(Math.max(Math.abs(o.x-P.x),Math.abs(o.y-P.y))<=2)openNpc(o);}}
    updMons(dt);updPeers(dt);tickRegen(dt);updSkills();const _l1=performance.now();render();const _l2=performance.now();warmStep();DIAG.add('logic',_l1-_l0);DIAG.add('render',_l2-_l1);DIAG.add('frame',dt);DIAG.n++;
    PERF.acc+=dt;PERF.n++;if(dt>PERF.worst)PERF.worst=dt;if(PERF.acc>=1000){PERF.fps=Math.round(PERF.n*1000/PERF.acc);PERF.hist.push(PERF.fps);if(PERF.hist.length>4)PERF.hist.shift();adaptQuality();$('#fps').textContent=PERF.fps+' FPS · '+QUALITY[PERF.q].name;showDiag();PERF.acc=0;PERF.n=0;PERF.worst=0;}
    saveT+=dt;if(saveT>20000){saveT=0;if(G.saveDirty)saveNow(true);}
    if(G.time%1000<dt)pushPresence();
    if(G.pearlNote&&!(G.buffs.pearl>G.time)){G.pearlNote=0;log("드래곤의 진주의 효과가 사라졌습니다.","c-sys");}
    if(G.waferNote&&!(G.buffs.wafer>G.time)){G.waferNote=0;log("엘븐 와퍼의 효과가 사라졌습니다.","c-sys");}}
  requestAnimationFrame(loop);}
async function boot(){loadExtSprites();cv=$('#cv');ctx=cv.getContext('2d',{alpha:false});resize();makeTex();setupInput();
  await Store.init();if(SESSION)onLogin();else showAuth();requestAnimationFrame(loop);}
boot();

</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리클라인 ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b86a;--gold2:#f3dd9c;--ink:#e9e2d0;--panel:rgba(18,14,10,.88);--line:#6b5532}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0907;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hidden{display:none!important}
button{font-family:inherit}
.btn{background:linear-gradient(#5a4526,#3a2c18);border:1px solid var(--gold);color:var(--gold2);padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.25)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sm{padding:3px 8px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6);border-radius:6px}
.ttl{font-family:'Nanum Myeongjo',serif;color:var(--gold2);font-weight:800}
/* title / create */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3a2a14 0%,#120d08 60%,#060504 100%);z-index:50;overflow:auto}
#screen .box{width:min(980px,96vw);padding:22px 26px;margin:20px}
.logo{font-family:'Nanum Myeongjo',serif;font-size:64px;font-weight:800;text-align:center;letter-spacing:10px;background:linear-gradient(#fff3c4,#d9a441 55%,#7a5317);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.2);margin:6px 0 0}
.sub{text-align:center;color:#b9a77f;margin-bottom:18px;font-size:13px;letter-spacing:3px}
.chars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.ch{border:1px solid #4a3a22;border-radius:6px;padding:6px 2px 8px;text-align:center;cursor:pointer;background:rgba(0,0,0,.35);transition:.15s}
.ch:hover{border-color:var(--gold)}
.ch.sel{border-color:var(--gold2);background:rgba(217,184,106,.16);box-shadow:0 0 12px rgba(217,184,106,.35)}
.ch canvas{width:100%;height:auto;display:block}
.ch b{font-size:13px;color:var(--gold2)}
.ch small{display:block;color:#a8987a;font-size:11px}
.crow{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.crow>div{flex:1;min-width:280px}
.stat{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.stat span.k{width:42px;color:var(--gold)}
.stat span.v{width:28px;text-align:center;font-weight:700}
input.tx{background:#0d0a07;border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:4px;font-size:14px;width:100%}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{border:1px solid #4a3a22;border-radius:6px;padding:8px;text-align:center;background:rgba(0,0,0,.3);min-height:150px;cursor:pointer}
.slot:hover{border-color:var(--gold)}
.slot canvas{width:90px;height:auto}
.note{font-size:12px;color:#9d8f73}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#stat{position:absolute;left:10px;top:10px;padding:8px 10px;width:250px}
.bar{height:14px;border:1px solid #000;border-radius:3px;background:#1a1410;position:relative;margin:3px 0;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar em{position:absolute;inset:0;text-align:center;font-size:10px;line-height:13px;font-style:normal;text-shadow:0 1px 1px #000}
#hpb i{background:linear-gradient(#e35050,#8e1b1b)}#mpb i{background:linear-gradient(#5a8cf0,#1d3f94)}#exb i{background:linear-gradient(#e9d27a,#9a7a1c)}
#stat .nm{font-weight:700;color:var(--gold2);font-size:14px}
#stat .lv{font-size:12px;color:#c9b88f}
#mini{position:absolute;right:10px;top:10px;padding:6px}
#mini canvas{display:block;width:200px;height:200px;image-rendering:pixelated}
#mini .mapn{font-size:12px;text-align:center;color:var(--gold2);margin-bottom:3px}
#hot{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:6px}
.hk{width:54px;height:54px;border:1px solid #5b482a;border-radius:4px;background:#100c08;position:relative;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;line-height:1.15;padding:2px}
.hk:hover{border-color:var(--gold)}
.hk b{position:absolute;left:3px;top:1px;color:var(--gold);font-size:10px}
.hk s{position:absolute;right:3px;bottom:1px;text-decoration:none;color:#fff;font-size:10px}
#log{position:absolute;left:10px;bottom:10px;width:380px;height:170px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column}
#logl{flex:1;overflow-y:auto;line-height:1.45}
#logl div{text-shadow:0 1px 1px #000}
#chatin{margin-top:4px;padding:4px 6px;font-size:12px}
.c-sys{color:#e6d38a}.c-dmg{color:#ff9a7a}.c-get{color:#9fe39a}.c-chat{color:#fff}.c-bad{color:#ff6b6b}.c-peer{color:#9fd3ff}
#menu{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;padding:6px}
.win{position:absolute;padding:10px 12px;max-height:80vh;overflow:auto;z-index:20}
.win h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.win h3 .x{cursor:pointer;color:#c9b88f;font-size:14px}
#inv{right:220px;top:10px;width:452px;background:linear-gradient(160deg,rgba(58,52,58,.96),rgba(26,22,26,.96));border-color:#7a6a5a}
.pd{display:flex;gap:8px}.pl{width:176px}.pr{flex:1;position:relative;min-height:300px;background:radial-gradient(ellipse at 50% 40%,rgba(90,80,96,.55),rgba(10,8,12,.6));border:1px solid #3a3238;border-radius:4px}
.ps{width:100%;border-collapse:collapse;font-size:11.5px;font-family:Georgia,'Nanum Myeongjo',serif}.ps td{padding:1.5px 4px;border-bottom:1px solid rgba(255,255,255,.04)}.ps td:last-child{text-align:right;color:#f1ead8}.ps tr.hd td{color:#f3dd9c;background:rgba(0,0,0,.35);font-weight:700}.ps tr.sp td{height:5px;border:0}.ps td:first-child{color:#cfc4b0}
#pdc{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:150px;height:234px;pointer-events:none}
.dollg{position:relative;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(5,46px);gap:9px 26px;justify-content:center;padding:10px 0;grid-template-areas:". helm amul" "shirt armor cloak" "wpn glove shld" "r1 belt r2" "r3 boot r4"}
.sq{width:44px;height:44px;border:1px solid #6a5a48;background:linear-gradient(145deg,rgba(0,0,0,.55),rgba(40,34,30,.75));box-shadow:inset 0 0 6px rgba(0,0,0,.9),0 0 0 1px #000;border-radius:2px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq:hover{border-color:#e6c878;box-shadow:inset 0 0 6px #000,0 0 6px rgba(230,200,120,.5)}.sq img{width:40px;height:40px}.sq span{font-size:9.5px;color:#7a6c5a}.sq.e{cursor:default}.sq.e:hover{border-color:#6a5a48;box-shadow:inset 0 0 6px rgba(0,0,0,.9)}
.sq i{position:absolute;font-style:normal;font-size:10px;font-weight:700;text-shadow:0 0 2px #000,0 0 2px #000}.sq i.ct{right:2px;bottom:0;color:#fff}.sq i.en{left:2px;top:0;color:#9fd3ff}
.bag{display:grid;grid-template-columns:repeat(9,44px);gap:4px;max-height:200px;overflow-y:auto;padding:2px}
.eq{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.eqs{border:1px solid #4a3a22;border-radius:3px;min-height:40px;font-size:11px;padding:3px;background:#0f0b08;cursor:pointer}
.eqs u{display:block;text-decoration:none;color:#857455;font-size:10px}
.eqs:hover{border-color:var(--gold)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.it{border:1px solid #3a2e1c;border-radius:3px;padding:4px 6px;font-size:12px;cursor:pointer;background:#0f0b08;display:flex;justify-content:space-between;gap:4px}
.it:hover{border-color:var(--gold)}
.it .q{color:#c9b88f}
.r1{color:#ffffff}.r2{color:#8fd0ff}.r3{color:#f0c060}.r4{color:#ff8a8a}
#chr{left:270px;top:10px;width:300px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--gold)}
#npc{left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t td,table.t th{border-bottom:1px solid #2e2516;padding:4px 5px;text-align:left}
table.t th{color:var(--gold);position:sticky;top:0;background:#16110b}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs .btn.on{background:linear-gradient(#8a6a34,#5a4320)}
#tip{position:fixed;pointer-events:none;z-index:99;padding:7px 9px;font-size:12px;max-width:280px;line-height:1.5}
#tip b{color:var(--gold2)}
#death{position:fixed;inset:0;background:rgba(40,0,0,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:60;gap:14px}
#death .ttl{font-size:40px}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:'Nanum Myeongjo',serif;font-size:30px;color:var(--gold2);text-shadow:0 2px 6px #000;pointer-events:none;z-index:40;transition:opacity .6s}
#online{position:absolute;right:10px;top:278px;padding:6px 8px;font-size:11.5px;max-width:200px}
@media (max-width:760px){.chars{grid-template-columns:repeat(4,1fr)}#log{width:60vw;height:120px}#mini canvas{width:120px;height:120px}#inv{right:4px;width:94vw}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="screen"><div class="box panel" id="sbox"></div></div>
<div id="hud" class="hidden">
  <div id="stat" class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="nm" id="snm"></span><span class="lv" id="slv"></span></div>
    <div class="bar" id="hpb"><i></i><em></em></div>
    <div class="bar" id="mpb"><i></i><em></em></div>
    <div class="bar" id="exb"><i></i><em></em></div>
    <div class="lv" id="sgold"></div>
  </div>
  <div id="mini" class="panel"><div class="mapn" id="mapn"></div><canvas id="mcv" width="200" height="200"></canvas><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11px"><span id="fps" class="note">-</span><select id="qsel" style="background:#0d0a07;color:#e9e2d0;border:1px solid #6b5532;font-size:11px;border-radius:3px"><option value="a">화질 자동</option><option value="0">고화질</option><option value="1">표준</option><option value="2">성능</option><option value="3">최대 성능</option></select></div></div>
  <div id="online" class="panel hidden"></div>
  <div id="diag" class="panel hidden" style="position:absolute;right:10px;top:360px;width:300px;padding:8px 10px;font-size:11.5px;line-height:1.55"></div>
  <div id="hot" class="panel"></div>
  <div id="log" class="panel"><div id="logl"></div><input id="chatin" class="tx" placeholder="Enter로 채팅" maxlength="80"></div>
  <div id="menu" class="panel">
    <button class="btn sm" data-w="inv">인벤토리 (I)</button>
    <button class="btn sm" data-w="chr">캐릭터 (C)</button>
    <button class="btn sm" id="bsave">저장</button>
    <button class="btn sm" id="bexit">캐릭터 선택</button>
  </div>
  <div id="inv" class="win panel hidden"></div>
  <div id="chr" class="win panel hidden"></div>
  <div id="npc" class="win panel hidden"></div>
</div>
<div id="tip" class="panel hidden"></div>
<div id="toast"></div>
<div id="death" class="hidden"><div class="ttl">사망하였습니다</div><div class="note">경험치 일부를 잃었습니다.</div><button class="btn" id="brev">마을에서 다시 시작</button></div>

const TW=64,TH=32;
const T={DEEP:0,SHAL:1,SAND:2,GRASS:3,FOREST:4,ROAD:5,STONE:6,CFLOOR:7,CWALL:8};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function h2(x,y,s){let h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,sc,s){const fx=x/sc,fy=y/sc,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,u=tx*tx*(3-2*tx),v=ty*ty*(3-2*ty);
  const a=h2(ix,iy,s),b=h2(ix+1,iy,s),c=h2(ix,iy+1,s),d=h2(ix+1,iy+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){return vnoise(x,y,24,s)*.55+vnoise(x,y,9,s+7)*.3+vnoise(x,y,4,s+13)*.15;}
function inPoly(x,y,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}

class Map2{
  constructor(id,W,H,ox,oy){this.id=id;this.W=W;this.H=H;this.ox=ox;this.oy=oy;const n=W*H;this.t=new Uint8Array(n);this.o=new Uint8Array(n);this.b=new Uint8Array(n);this.v=new Uint8Array(n);this.npcs=[];this.portals=[];this.labels=[];this.houses=[];this.spawns=[];this.dark=false;}
  idx(x,y){return(y-this.oy)*this.W+(x-this.ox);}
  inb(x,y){return x>=this.ox&&y>=this.oy&&x<this.ox+this.W&&y<this.oy+this.H;}
  tile(x,y){return this.inb(x,y)?this.t[this.idx(x,y)]:T.DEEP;}
  walk(x,y){if(!this.inb(x,y))return false;const i=this.idx(x,y);const t=this.t[i];return!this.b[i]&&t!==T.DEEP&&t!==T.SHAL&&t!==T.CWALL;}
}

// ---------- dungeons ----------
function genDungeon(id){
  const W=id===1?150:160,H=id===1?120:130,ox=32600,oy=32700,M=new Map2(id,W,H,ox,oy);M.dark=true;M.name='말하는 섬 던전 '+id+'층';
  const r=rng(1234+id*77);let g=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0;g[i]=(x<2||y<2||x>W-3||y>H-3)?1:(r()<.45?1:0);}
  for(let it=0;it<5;it++){const n=new Uint8Array(W*H);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)c+=g[(y+dy)*W+x+dx];n[y*W+x]=c>=5?1:0;}for(let i=0;i<W*H;i++){const x=i%W,y=(i/W)|0;if(x<2||y<2||x>W-3||y>H-3)n[i]=1;}g=n;}
  // largest region
  const lab=new Int32Array(W*H).fill(-1);let best=-1,bestN=0,regs=[];
  for(let i=0;i<W*H;i++){if(g[i]||lab[i]>=0)continue;const id2=regs.length,st=[i];lab[i]=id2;let n=0;while(st.length){const k=st.pop();n++;const x=k%W,y=(k/W)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const j=(y+dy)*W+x+dx;if(!g[j]&&lab[j]<0){lab[j]=id2;st.push(j);}});}regs.push(n);if(n>bestN){bestN=n;best=id2;}}
  for(let i=0;i<W*H;i++){const fl=!g[i]&&lab[i]===best;M.t[i]=fl?T.CFLOOR:T.CWALL;M.v[i]=(h2(i%W,(i/W)|0,id)*8)|0;}
  // start = floor near top-left; far = max BFS
  let s=-1;for(let d=0;d<W+H&&s<0;d++)for(let x=0;x<=d&&s<0;x++){const y=d-x;if(x<W&&y<H&&M.t[y*W+x]===T.CFLOOR)s=y*W+x;}
  const dist=new Int32Array(W*H).fill(-1),q=[s];dist[s]=0;let far=s;for(let h=0;h<q.length;h++){const k=q[h],x=k%W,y=(k/W)|0;if(dist[k]>dist[far])far=k;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const j=(y+dy)*W+x+dx;if(M.t[j]===T.CFLOOR&&dist[j]<0){dist[j]=dist[k]+1;q.push(j);}});}
  const P=k=>[k%W+ox,((k/W)|0)+oy];
  const sp=P(s),fp=P(far);
  M.portals.push({x:sp[0],y:sp[1],to:id-1,name:id===1?'말하는 섬 (지상)':'던전 1층',up:true});
  if(id===1)M.portals.push({x:fp[0],y:fp[1],to:2,name:'던전 2층'});
  M.start=findNear(M,sp[0],sp[1]);
  M.far=fp;
  // rocks/pillars decor
  for(let i=0;i<W*H;i++){if(M.t[i]===T.CFLOOR&&h2(i,id,8)<.012&&dist[i]>4){M.o[i]=7;M.b[i]=1;}}
  // spawns
  const list=GD.mapMons[id].filter(n=>!GD.mons[n].boss);const cnt=id===1?75:90;
  const floors=[];for(let i=0;i<W*H;i++)if(M.t[i]===T.CFLOOR&&!M.b[i]&&dist[i]>12)floors.push(i);
  for(let k=0;k<cnt;k++){const i=floors[(r()*floors.length)|0],[x,y]=P(i);const lvW=list.map(n=>1/(1+Math.abs(GD.mons[n].lv-(id===1?8:13))));let tot=lvW.reduce((a,b)=>a+b),pick=r()*tot,n=list[0];for(let j=0;j<list.length;j++){pick-=lvW[j];if(pick<=0){n=list[j];break;}}
    M.spawns.push({n,x,y,box:[x-6,y-6,x+6,y+6]});}
  if(id===2){const b=GD.mapMons[2].find(n=>GD.mons[n].boss);if(b)M.spawns.push({n:b,x:fp[0],y:fp[1],box:[fp[0]-4,fp[1]-4,fp[0]+4,fp[1]+4],boss:true});}
  return M;
}

const SAFE={x1:32556,x2:32666,y1:32916,y2:32958};

function findNear(M,x,y){for(let r=2;r<8;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;if(M.walk(x+dx,y+dy)&&!M.portals.some(p=>p.x===x+dx&&p.y===y+dy))return[x+dx,y+dy];}return[x,y];}
function mstat(n){const m=GD.mons[n]||{lv:1};const lv=m.lv,boss=m.boss;
  return{lv,boss,mhp:Math.round((8+lv*lv*0.9+lv*7)*(boss?9:1)),dmg:[1+Math.floor(lv/4),2+Math.floor(lv*1.25)+(boss?lv/2:0)],ac:Math.max(-15,8-Math.floor(lv/2)),
    exp:Math.round((lv*lv+3)*(boss?12:1)),aggro:boss||/흑기사|해골|스파토이|좀비|구울|버그베어|늑대인간|라이칸|장로|웅골리언트|셸로브|괴물 눈/.test(n),

function spawnMon(sp){const st=mstat(sp.n);let x=sp.x,y=sp.y;const M=G.map;
  let ok=false;for(let k=0;k<40;k++){const tx=rnd(sp.box[0],sp.box[2]),ty=rnd(sp.box[1],sp.box[3]);if(M.walk(tx,ty)&&!inSafe(tx,ty)){x=tx;y=ty;ok=true;break;}}

function getMap(id){if(!G.maps[id])G.maps[id]=id===0?genIsland():genDungeon(id);return G.maps[id];}

// ---------- pathfinding (A*) ----------
function findPath(sx,sy,tx,ty,maxN=4000,adj){const M=G.map;if(!adj&&!M.walk(tx,ty))return null;
  const key=(x,y)=>x*100000+y;const came=new Map(),gs=new Map([[key(sx,sy),0]]),closed=new Set();let n=0;
  const h=(x,y)=>Math.max(Math.abs(x-tx),Math.abs(y-ty));
  const H=[[sx,sy,0,h(sx,sy)]];const push=e=>{H.push(e);let i=H.length-1;while(i>0){const p=(i-1)>>1;if(H[p][3]<=H[i][3])break;[H[p],H[i]]=[H[i],H[p]];i=p;}};
  const pop=()=>{const top=H[0],last=H.pop();if(H.length){H[0]=last;let i=0;for(;;){const l=i*2+1,r=l+1;let m=i;if(l<H.length&&H[l][3]<H[m][3])m=l;if(r<H.length&&H[r][3]<H[m][3])m=r;if(m===i)break;[H[m],H[i]]=[H[i],H[m]];i=m;}}return top;};
  while(H.length&&n++<maxN){const[cx,cy,g]=pop();const ck=key(cx,cy);if(closed.has(ck))continue;closed.add(ck);
    if((cx===tx&&cy===ty)||(adj&&h(cx,cy)<=adj)){const p=[];let k=ck;while(came.has(k)){p.unshift([Math.floor(k/100000),k%100000]);k=came.get(k);}return p;}
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!M.walk(nx,ny))continue;if(dx&&dy&&(!M.walk(cx+dx,cy)||!M.walk(cx,cy+dy)))continue;
      const ng=g+(dx&&dy?1.41:1),k=key(nx,ny);if(ng<(gs.get(k)??1e9)){gs.set(k,ng);came.set(k,ck);push([nx,ny,ng,ng+h(nx,ny)*1.01]);}}}
  return null;}

// ---------- movement ----------
function dirFrom(dx,dy){const sx=dx-dy,sy=dx+dy;if(Math.abs(sx)>Math.abs(sy)*1.2)return sx>0?'E':'W';return sy>0?'S':'N';}
function stepPlayer(dt,C){
  if(P.t<1){P.t=Math.min(1,P.t+dt/C.mspd);return;}
  let dx=0,dy=0;const k=G.keys;
  const up=k.ArrowUp||k.w,dn=k.ArrowDown||k.s,lf=k.ArrowLeft||k.a,rt=k.ArrowRight||k.d;
  if(up){dx--;dy--;}if(dn){dx++;dy++;}if(lf){dx--;dy++;}if(rt){dx++;dy--;}
  dx=Math.sign(dx);dy=Math.sign(dy);
  if(dx||dy){G.path=null;G.target=null;}
  else if(G.target){const m=G.target;if(m.dead||m.map===false){G.target=null;}else{const d=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));
      if(d<=C.range){tryAttack(m,C);return;}
      if(!G.path||!G.path.length||(G.pathFor!==m.x+','+m.y&&G.time-(G.planT||0)>350)){G.planT=G.time;G.path=findPath(P.x,P.y,m.x,m.y,2500,C.range);G.pathFor=m.x+','+m.y;if(!G.path){G.target=null;return;}}}}
  if(!dx&&!dy&&G.path&&G.path.length){const[nx,ny]=G.path[0];dx=nx-P.x;dy=ny-P.y;if(!G.map.walk(nx,ny)){G.path=null;return;}G.path.shift();}
  if(!dx&&!dy)return;
  let nx=P.x+dx,ny=P.y+dy;const M=G.map;
  if(!M.walk(nx,ny)||(dx&&dy&&(!M.walk(P.x+dx,P.y)||!M.walk(P.x,P.y+dy)))){if(M.walk(P.x+dx,P.y)&&dx){ny=P.y;dy=0;}else if(M.walk(P.x,P.y+dy)&&dy){nx=P.x;dx=0;}else{P.dir=dirFrom(dx,dy);return;}}
  P.dir=dirFrom(dx,dy);P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0;
  onStep();
}
function onStep(){const M=G.map;
  for(const p of M.portals){if(p.x===P.x&&p.y===P.y){usePortal(p);return;}}
  // auto pickup
  for(const g of [...G.ground]){if(g.x===P.x&&g.y===P.y&&g.map===M.id)pickup(g);}
  pushPresence();}
function usePortal(p){if(p.to===0){const e=GD.portals.find(q=>q.frm===0&&q.to===1);enterMap(0,e.x+2,e.y+2);}else if(p.to===1&&G.map.id===2){const m1=getMap(1);const sp2=findNear(m1,m1.far[0],m1.far[1]);enterMap(1,sp2[0],sp2[1]);}else enterMap(p.to);log(p.name+'(으)로 이동했습니다.','c-sys');}
function pickup(g){G.ground.splice(G.ground.indexOf(g),1);invAdd(g.n,g.q,g.e);log((g.n==='아데나'?fmt(g.q)+' 아데나':itemName(g)+(g.q>1?' ('+g.q+')':''))+'을(를) 획득했습니다.','c-get');refreshUI();}

// ---------- combat ----------
function hitChance(lv,hitB,ac,mlv){return Math.max(.08,Math.min(.95,.62+(lv-mlv)*.035+hitB*.04+(ac-5)*.012));}
function aimAt(m){P.aimA=Math.atan2((m.x+m.y-P.x-P.y)*16,(m.x-m.y-P.x+P.y)*32);}
function tryAttack(m,C){const now=G.time;if(now-G.lastAtk<C.aspd)return;
  P.dir=dirFrom(m.x-P.x,m.y-P.y);G.lastAtk=now;P.atkT=now;P.atkK=C.ranged?'b':'m';aimAt(m);

function meleeResolve(m,C,arrow){if(m.dead)return;const w=eqItem('weapon'),wd=w?ITEM(w.n):null;

function updMons(dt){const now=G.time;for(const m of G.mons){
  if(m.dead){if(now>m.respawn){const n=spawnMon(m.sp);if(n)Object.assign(m,n);}continue;}
  if(m.t<1){m.t=Math.min(1,m.t+dt/m.spd);continue;}
  if(now<m.next)continue;
  const d=Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y));
  const chase=!G.dead&&!inSafe(P.x,P.y)&&(m.attacked&&d<16||m.aggro&&d<8)&&G.map.id===P.map;
  if(chase){const rng2=m.ranged||1;

      const dmg=rnd(m.dmg[0],Math.ceil(m.dmg[1]));
      if(m.ranged){G.fx.push({k:m.n.includes('장로')||m.n.includes('괴물')?'mbolt':'arrow',x0:m.x,y0:m.y,x1:P.x,y1:P.y,t0:now,dur:300,cb:()=>playerHit(m,dmg)});}else playerHit(m,dmg);continue;}
    const sx=Math.sign(P.x-m.x),sy=Math.sign(P.y-m.y);let moved=false;
    for(const[ax,ay]of[[sx,sy],[sx,0],[0,sy],[sx,-sy],[-sx,sy]]){if(!ax&&!ay)continue;const nx=m.x+ax,ny=m.y+ay;if(G.map.walk(nx,ny)&&!inSafe(nx,ny)&&!(nx===P.x&&ny===P.y)){m.fx=m.x;m.fy=m.y;m.x=nx;m.y=ny;m.t=0;m.dir=(ax-ay)>=0?'E':'W';moved=true;break;}}
    m.next=now+(moved?0:400);continue;}
  if(m.attacked&&d>=16)m.attacked=false;
  // wander
  if(Math.random()<.5){const ax=rnd(-1,1),ay=rnd(-1,1),nx=m.x+ax,ny=m.y+ay,b=m.sp.box;
    if((ax||ay)&&G.map.walk(nx,ny)&&!inSafe(nx,ny)&&nx>=b[0]-3&&nx<=b[2]+3&&ny>=b[1]-3&&ny<=b[3]+3){m.fx=m.x;m.fy=m.y;m.x=nx;m.y=ny;m.t=0;m.dir=(ax-ay)>=0?'E':'W';}}
  m.next=now+1200+Math.random()*2500;}}

// ---------- realtime (presence + chat + duplicate-login kick) ----------
let lastPres=0,lastPresSig='';
function initRoom(){if(CHAN||!SESSION)return;
  CHAN=SB.channel('reclain-world',{config:{presence:{key:SESSION.user.id+':'+MY_NONCE},broadcast:{self:true}}});
  CHAN.on('presence',{event:'sync'},()=>{const st=CHAN.presenceState();const seen=new Set();
    for(const key in st){if(key.endsWith(':'+MY_NONCE))continue;const pr=st[key][0]||{};if(!pr.n)continue;seen.add(key);
      let o=G.peers.get(key);if(!o){o={rx:+pr.x,ry:+pr.y};G.peers.set(key,o);}
      Object.assign(o,{n:String(pr.n).slice(0,12),lk:pr.lk,lv:pr.lv|0,m:pr.m,x:+pr.x,y:+pr.y,d:['S','N','E','W'].includes(pr.d)?pr.d:'S',hp:Math.max(0,Math.min(100,+pr.hp||100)),w:typeof pr.w==='string'?pr.w:null,sh:!!pr.sh});
      o.ak=['m','b','c'].includes(pr.ak)?pr.ak:'m';o.aa=typeof pr.aa==='number'&&isFinite(pr.aa)?pr.aa:null;o.ac=CAST_COL[pr.ac]?pr.ac:null;
      if(pr.at&&pr.at!==o.at){o.at=pr.at;o.atLocal=G.time;}}
    for(const k of [...G.peers.keys()])if(!seen.has(k))G.peers.delete(k);renderOnline();});
  CHAN.on('broadcast',{event:'chat'},({payload:d})=>{if(!d||typeof d.t!=='string')return;if(d.id&&SENT.has(d.id))return;log(String(d.n||'?').slice(0,12)+': '+d.t.slice(0,80),d.u===SESSION.user.id?'c-chat':'c-peer');});
  CHAN.on('broadcast',{event:'kick'},({payload:d})=>{if(d&&d.u===SESSION.user.id&&d.nonce!==MY_NONCE){P&&saveNow(true);P=null;CHAN&&SB.removeChannel(CHAN);CHAN=null;G.peers.clear();showAuth('다른 곳에서 같은 계정으로 접속하여 연결이 종료되었습니다.');}});
  const ch=CHAN;ch.subscribe(s=>{if(ch!==CHAN)return;if(s==='SUBSCRIBED'){lastPresSig='';setTimeout(flushChat,300);CHAN.send({type:'broadcast',event:'kick',payload:{u:SESSION.user.id,nonce:MY_NONCE}});pushPresence(true);}
    else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){reconnectRoom();}});}
// 연결이 끊기면 자동 재접속 (탭 전환·네트워크 끊김 대비)
let reconnT=0;function reconnectRoom(){if(reconnT)return;reconnT=setTimeout(()=>{reconnT=0;if(!SESSION||!P)return;const old=CHAN;CHAN=null;G.peers.clear();renderOnline();try{old&&SB.removeChannel(old);}catch(e){}initRoom();},1500);}
setInterval(()=>{if(SESSION&&P&&(!CHAN||(CHAN.state!=='joined'&&CHAN.state!=='joining')))reconnectRoom();else if(CHAN&&CHAN.state==='joined')pushPresence(true);},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SESSION&&P){if(!CHAN||CHAN.state!=='joined')reconnectRoom();else pushPresence(true);}});
function pushPresence(force){if(!CHAN||!P)return;const now=performance.now();if(!force&&now-lastPres<250)return;
  const o={n:P.name,lk:P.look,lv:P.lv,m:P.map,x:P.x,y:P.y,d:P.dir||'S',hp:Math.round(P.hp/Math.max(1,P.mhp)*100),w:(eqItem('weapon')||{}).n||null,sh:!!P.eq.shield,at:P.atkT?Math.floor(P.atkT):0,ak:P.atkK||'m',aa:P.aimA!=null?Math.round(P.aimA*100)/100:null,ac:P.castK||null};
  const sig=JSON.stringify(o);if(sig===lastPresSig&&!force)return;lastPres=now;lastPresSig=sig;CHAN.track(o).catch(()=>{});}
function renderOnline(){const el=$('#online');const list=[...G.peers.values()];if(!P){el.classList.add('hidden');return;}el.classList.remove('hidden');

// 채팅: 연결이 잠깐 끊겨도 메시지를 잃지 않도록 대기열에 넣었다가 재접속 후 전송

function sendChat(){const inp=$('#chatin');const t=inp.value.trim();inp.value='';inp.blur();if(!t||!P)return;
  const m={id:MY_NONCE+':'+Date.now().toString(36),u:SESSION?SESSION.user.id:'',n:P.name,t:t.slice(0,80)};SENT.add(m.id);log(P.name+': '+m.t,'c-chat');
  CHATQ.push(m);if(CHAN&&CHAN.state==='joined')flushChat();else{log('(연결 중… 연결되면 전송됩니다)','c-sys');reconnectRoom();}}

function worldAt(mx,my){const[cx,cy]=G.cam;const wx=mx+cx,wy=my+cy-16;return scr2tile(wx,wy);}
function pickAt(mx,my){const[cx,cy]=G.cam;let best=null,bd=1e9;const M=G.map;
  const test=(x,y,w,h,obj,dy=0)=>{const[a,b]=iso(x,y);const sx=a-cx,sy=b-cy+16;if(mx>sx-w/2&&mx<sx+w/2&&my>sy-h&&my<sy+6){const d=Math.abs(mx-sx)+Math.abs(my-(sy-h/2))-(x+y)*0.01;if(d<bd){bd=d;best=obj;}}};
  for(const m of G.mons){if(m.dead)continue;const[a,b]=ePos(m);const sc=MSIZE[monArch(m.n)]||1;test(a,b,48*sc,60*sc,m);}
  for(const n of M.npcs)test(n.x,n.y,40,96,n);
  for(const g of G.ground)if(g.map===M.id)test(g.x,g.y,26,24,g);
  return best;}

  $('#bsave').onclick=()=>saveNow();$('#bexit').onclick=async()=>{await saveNow(true);P=null;closeNpc();renderOnline();showSelect();};
  $('#fps').style.cursor='pointer';$('#fps').title='클릭: 성능 진단';$('#fps').onclick=()=>{DIAG.on=!DIAG.on;$('#diag').classList.toggle('hidden',!DIAG.on);};const qs=$('#qsel');qs.value=PERF.auto?'a':String(PERF.q);qs.onchange=()=>{if(qs.value==='a')setQuality(1,true);else setQuality(+qs.value,false);qs.blur();};
  $('#brev').onclick=revive;addEventListener('resize',resize);
  addEventListener('beforeunload',()=>{if(P&&G.saveDirty)saveNow(true);});}
// ---------- loop ----------
let lastT=performance.now();
const QUALITY=[{name:'고화질',dpr:2},{name:'표준',dpr:1.25},{name:'성능',dpr:1},{name:'최대 성능',dpr:.75}];
const PERF={acc:0,n:0,fps:60,worst:0,hist:[],q:1,auto:true,lastAdapt:0};
try{const s=window.localStorage&&localStorage.getItem('reclain_q');if(s){const o=JSON.parse(s);PERF.q=o.q;PERF.auto=o.auto;}}catch(e){}
function showDiag(){const el=$('#diag');if(!DIAG.on){DIAG.acc={};DIAG.n=0;return;}const n=Math.max(1,DIAG.n),a=DIAG.acc,g=DIAG.gpuInfo(),f=v=>((v||0)/n).toFixed(1)+'ms';
  const busy=(a.logic+a.render)/n,fr=a.frame/n;
  let verdict=g.sw?'⚠ 그래픽 가속이 꺼져 있습니다 (소프트웨어 렌더링). 브라우저 설정에서 "그래픽 가속 사용"을 켜고 재시작하세요.':busy>14?'⚠ 게임 처리 자체가 무겁습니다. 이 화면을 캡처해서 보내주세요.':fr>busy*1.8&&fr>20?'⚠ 게임 처리는 '+busy.toFixed(1)+'ms로 가볍지만 프레임 간격이 '+fr.toFixed(1)+'ms입니다. 브라우저/OS가 속도를 제한하고 있습니다 (절전 모드, 배터리, 백그라운드 탭, 그래픽 가속 확인).':'정상 범위입니다.';
  el.innerHTML='<b style="color:#f3dd9c">성능 진단</b> (F3 닫기)<br>프레임 간격 '+fr.toFixed(1)+'ms · 게임 처리 '+busy.toFixed(1)+'ms<br>로직 '+f(a.logic)+' · 그리기 '+f(a.render)+'<br>└ 바닥 '+f(a.ground)+' · 물체 '+f(a.objects)+' · 효과 '+f(a.effects)+' · 미니맵 '+f(a.minimap)+'<br>그리는 개체 '+DIAG.draws+'개 · 해상도 '+cv.width+'×'+cv.height+' (배율 '+DPR+')<br>GPU: '+esc(g.s)+'<br><span style="color:'+(verdict.startsWith('⚠')?'#ff9a7a':'#9fe39a')+'">'+verdict+'</span>';
  DIAG.acc={};DIAG.n=0;}
function setQuality(q,auto){PERF.q=q;PERF.auto=auto;try{localStorage.setItem('reclain_q',JSON.stringify({q,auto}));}catch(e){}resize();for(const k in OVL)delete OVL[k];}
function adaptQuality(){if(!PERF.auto||PERF.hist.length<3||performance.now()-PERF.lastAdapt<5000)return;const avg=PERF.hist.reduce((a,b)=>a+b)/PERF.hist.length;
  if(avg<45&&PERF.q<QUALITY.length-1){PERF.lastAdapt=performance.now();setQuality(PERF.q+1,true);PERF.hist=[];}else if(avg>58&&PERF.q>0&&(window.devicePixelRatio||1)>1.3&&PERF.hiOk!==false){}}
function loop(t){const dt=Math.min(100,t-lastT);lastT=t;
  if(P&&G.map){const _l0=performance.now();G.time+=dt;const C=calc();if(!G.dead){stepPlayer(dt,C);if(G.npcGo&&(!G.path||!G.path.length)){const o=G.npcGo;G.npcGo=null;if(Math.max(Math.abs(o.x-P.x),Math.abs(o.y-P.y))<=2)openNpc(o);}}
    updMons(dt);updPeers(dt);tickRegen(dt);const _l1=performance.now();render();const _l2=performance.now();warmStep();DIAG.add('logic',_l1-_l0);DIAG.add('render',_l2-_l1);DIAG.add('frame',dt);DIAG.n++;
    PERF.acc+=dt;PERF.n++;if(dt>PERF.worst)PERF.worst=dt;if(PERF.acc>=1000){PERF.fps=Math.round(PERF.n*1000/PERF.acc);PERF.hist.push(PERF.fps);if(PERF.hist.length>4)PERF.hist.shift();adaptQuality();$('#fps').textContent=PERF.fps+' FPS · '+QUALITY[PERF.q].name;showDiag();PERF.acc=0;PERF.n=0;PERF.worst=0;}
    saveT+=dt;if(saveT>20000){saveT=0;if(G.saveDirty)saveNow(true);}
    if(G.time%1000<dt)pushPresence();}
  requestAnimationFrame(loop);}
async function boot(){loadExtSprites();cv=$('#cv');ctx=cv.getContext('2d',{alpha:false});resize();makeTex();setupInput();
  await Store.init();if(SESSION)onLogin();else showAuth();requestAnimationFrame(loop);}
boot();

</script>
